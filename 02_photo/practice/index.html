<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>PHOTO BOOK - 写経・練習用</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="img/favicon.ico">
    <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">
    <link rel="stylesheet" href="css/style.css">
  </head>

  <body>
    <!-- 
      【写経ガイド 1: 全体コンテナ】
      - サイト全体幅1000px制御のため <div class="container"> で全体を包みます。
    -->
    <div class="container">
      <!-- 
        【写経ガイド 2: ヘッダー】
        - <header id="header">
        - ロゴを <h1 class="site-title"> 内の <a> タグで囲みます（src="img/logo.svg"）
      -->




      <!-- 
        【写経ガイド 3: メイン領域】
      -->
      <main>
        <!-- 
          【写経ガイド 3-1: メインビジュアル】
          - <div id="mainvisual"> で囲み <img>（src="img/mainvisual.jpg"）を記述。
        -->




        <!-- 
          【写経ガイド 3-2: INDEXセクション】
          - <section id="index">
          - 内部コンテンツ幅600pxに絞るため <div class="inner"> で囲みます。
          - 見出し <h2 class="section-title">INDEX</h2>
          - 順序付きリスト <ol class="index-list"> を作成し <li> を5つ並べます。
        -->




        <!-- 
          【写経ガイド 3-3: DETAILセクション】
          - <section id="detail">
          - <div class="inner"> 内に見出し <h2 class="section-title">DETAIL</h2> を配置。
          - 画像とテキストをFlexboxで並べるため <div class="content"> でグループ化。
          - 画像 <img class="img" src="img/detail.jpg"> と テキストブロック <div class="text"> を配置。
          - <div class="text"> 内に定義リスト <dl> を作成し、<dt>著者</dt><dd>値</dd> のペアを3つ記述します。
          - 別タブリンク <a class="link" href="#" target="_blank" rel="noopener noreferrer"> を設置します。
        -->




      </main>

      <!-- 
        【写経ガイド 4: フッター】
        - <footer id="footer">
        - <p class="inner">&copy; 2020 PHOTO BOOK</p>
      -->




    </div>
  </body>
</html>
