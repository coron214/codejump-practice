<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>Profile - 写経・練習用</title>
    <!-- 
      【写経ガイド: head設定】
      1. viewport メタタグを記述してスマホの画面幅へレスポンシブ対応させます。
      2. ファビコン（img/favicon.ico）を link タグで読み込みます。
      3. リセットCSS（ress.min.css）を自作スタイル（css/style.css）の【前】に読み込みます。
         (理由: CSSは後に読み込まれた指定が優先上書きされるため)
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="img/favicon.ico">
    <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">
    <link rel="stylesheet" href="css/style.css">
  </head>

  <body>
    <!-- 
      【写経ガイド 1: ヘッダーエリア】
      - <header id="header" class="wrapper"> を記述します。
      - 内部に最重要見出し <h1 class="site-title"> を用意し、ロゴ画像（img/logo.svg）を <a> タグ（index.html行き）で囲みます。
      - 右側のナビゲーションは <nav> タグ内に <ul> > <li> > <a href="#about"> 等の構造で記述します。
      
      ▼ ここから書いてみましょう！
    -->




    <!-- 
      【写経ガイド 2: メインエリア】
      - サイトの主要コンテンツ全体を <main> タグで囲みます。
    -->
    <main>
      <!-- 
        【写経ガイド 2-1: メインビジュアル】
        - <div id="mainvisual"> で囲み、内部に <img> タグ（src="img/mainvisual.jpg"）を配置します。
        
        ▼ ここから書いてみましょう！
      -->




      <!-- 
        【写経ガイド 2-2: About セクション】
        - <section id="about" class="wrapper"> を作成します。
        - 最初にセクション見出し <h2 class="section-title">About</h2> を配置します。
        - 次に、プロフィール画像と文章をFlexboxで横並びにするため <div class="content"> でグループ化します。
        - 内部に <img>（src="img/about.jpg"）と、文章ブロック <div class="text"> を配置します。
        - <div class="text"> 内には名前見出し <h3 class="content-title">KAKERU MIYAICHI</h3> と自己紹介 <p> を記述します。
        
        ▼ ここから書いてみましょう！
      -->




      <!-- 
        【写経ガイド 2-3: Bicycle セクション】
        - <section id="bicycle" class="wrapper"> を作成します。
        - セクション見出し <h2 class="section-title">Bicycle</h2> を配置します。
        - 3つの自転車カードを並べるため <ul> のリスト構造を作成します。
        - 各 <li> 内に、画像（img/bicycle1.jpg 〜 3.jpg）、小見出し <h3 class="content-title">、説明文 <p> を配置します。
        
        ▼ ここから書いてみましょう！
      -->




    </main>

    <!-- 
      【写経ガイド 3: フッターエリア】
      - <footer id="footer"> を記述します。
      - コピーライト表記 <p>&copy; 2020 Profile</p> を配置します。
      
      ▼ ここから書いてみましょう！
    -->




  </body>
</html>
