<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>Wooden Jewelry - 写経・練習用</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="img/favicon.ico">
    <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">
    <!-- Google Fonts 『Crimson Text』の読み込み -->
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
  </head>

  <body>
    <!-- 
      【写経ガイド 1: メインビジュアル】
      - <div id="mainvisual"> で包み <img>（src="img/mainvisual.jpg"）を配置します。
    -->




    <!-- 
      【写経ガイド 2: ヘッダー】
      - <header id="header">
      - 最重要ロゴ <h1 class="site-title"> 内の <a> でロゴ画像（src="img/logo.svg"）を配置。
      - ナビゲーション <nav> 内に <ul> > <li> で Concept(#concept), Work(#work), Contact(mailto:...) の3つを作成。
    -->




    <!-- 
      【写経ガイド 3: コンテンツコンテナ】
      - 最大幅1000px制限のため <div class="container"> で main と footer を包みます。
    -->
    <div class="container">
      <main>
        <!-- 
          【写経ガイド 3-1: Conceptセクション】
          - <section id="concept" class="content">
          - 左側画像 <div class="img"> 内に <img>（src="img/concept.jpg"）
          - 右側文章 <div class="text"> 内に <h2 class="section-title">、<span class="section-title-en">Concept</span>、<p>段落を配置。
        -->




        <!-- 
          【写経ガイド 3-2: Workセクション】
          - <section id="work" class="content">
          - 左側文章 <div class="text">（見出し、span.section-title-en, p段落）
          - 右側画像 <div class="img"> 内に <img>（src="img/work.jpg"）
        -->




      </main>

      <!-- 
        【写経ガイド 4: フッター】
        - <footer id="footer">
        - <div class="logo"> 内に <img>（src="img/logo.svg"）
        - コピーライト <p>&copy; 2021 Wooden Jewelry</p>
      -->




    </div>
  </body>
</html>
