<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>Recipe Diary - 写経・練習用</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="img/favicon.ico">
    <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">
    <link rel="stylesheet" href="css/style.css">
  </head>

  <body>
    <!-- 
      【写経ガイド 1: メイン構造】
      - <main> タグ内にコンテンツを配置します。
    -->
    <main>
      <!-- 
        【写経ガイド 1-1: メインビジュアル】
        - <div id="mainvisual"> で包み、<img>（src="img/mainvisual.jpg"）を配置します。
      -->




      <!-- 
        【写経ガイド 1-2: タイトル ＆ コンセプト説明】
        - <div class="text"> で包み、トップタイトル <h1 class="site-title">Recipe Diary</h1> と 説明文 <p> を記述します。
      -->




      <!-- 
        【写経ガイド 1-3: 3連ギャラリー】
        - <ul class="flex"> で <li> 3つを横並び作成し、それぞれ <img>（src="img/recipe1.jpg" 〜 3.jpg）を配置します。
      -->




      <!-- 
        【写経ガイド 1-4: ボタンエリア】
        - <div class="text"> 内に <a class="btn" href="#">レシピ一覧を見る</a> を記述します。
      -->




    </main>

    <!-- 
      【写経ガイド 2: フッター】
      - <footer id="footer">
      - SNSリンク集を <ul class="sns"> > <li> > <a> で作成します。（Instagram, Twitter, Facebook）
      - コピーライト <p>&copy; 2021 Recipe Diary</p> を記述します。
    -->




  </body>
</html>
