<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>Recipe Diary</title>
    <meta name="description" content="【入門編】レシピサイト（トップページ）の模範解答コードです。">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="img/favicon.ico">
    <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">
    <link rel="stylesheet" href="css/style.css">
  </head>

  <body>
    <main>
      <!-- メインビジュアル -->
      <div id="mainvisual">
        <img src="img/mainvisual.jpg" alt="メインビジュアル">
      </div>

      <!-- タイトル・説明テキスト -->
      <div class="text">
        <h1 class="site-title">Recipe Diary</h1>
        <p>
          日々の料理レシピをまとめています。<br>
          和食や洋食、中華、お菓子までいろいろな料理レシピをアップしていますので、<br>
          みなさんの献立にお役立てくださいね！
        </p>
      </div>

      <!-- 3連画像ギャラリー -->
      <ul class="flex">
        <li><img src="img/recipe1.jpg" alt="レシピ画像1"></li>
        <li><img src="img/recipe2.jpg" alt="レシピ画像2"></li>
        <li><img src="img/recipe3.jpg" alt="レシピ画像3"></li>
      </ul>

      <!-- レシピ一覧ボタン -->
      <div class="text">
        <a class="btn" href="#">レシピ一覧を見る</a>
      </div>
    </main>

    <!-- フッター -->
    <footer id="footer">
      <ul class="sns">
        <li><a href="#">Instagram</a></li>
        <li><a href="#">Twitter</a></li>
        <li><a href="#">Facebook</a></li>
      </ul>
      <p>&copy; 2021 Recipe Diary</p>
    </footer>
  </body>
</html>
