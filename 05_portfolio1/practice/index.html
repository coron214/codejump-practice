<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>My Portfolio - 写経・練習用</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="img/favicon.ico">
    <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">
    <link rel="stylesheet" href="css/style.css">
  </head>

  <body>
    <!-- 
      【写経ガイド 1: ヘッダー】
      - <header id="header">
      - ロゴ <h1 class="site-title"> 内の <a> タグ（src="img/logo.svg"）
      - ナビゲーション <nav> 内の <ul> > <li> で About, Works, News, Contact および Instagramアイコン（src="img/icon-instagram.png"）を配置します。
    -->




    <main>
      <!-- 
        【写経ガイド 2: メインビジュアル (<picture> タグでのレスポンシブ切り替え)】
        - <div id="mainvisual">
        - <picture> タグを使用し、
          <source media="(max-width: 600px)" srcset="img/mainvisual-sp.jpg">
          <img src="img/mainvisual-pc.jpg" alt="メインビジュアル">
          の構造で画面サイズに応じた最適な画像切り替えを実装します。
      -->




      <!-- 
        【写経ガイド 3: About セクション】
        - <section id="about" class="wrapper">
        - 見出し <h2 class="section-title">About</h2>
        - 文章ブロック <div class="content"> 内に <p> を配置します。
      -->




      <!-- 
        【写経ガイド 4: Works セクション】
        - <section id="works" class="wrapper">
        - 見出し <h2 class="section-title">Works</h2>
        - <ul> のリスト内に <li> 6つを作成し、それぞれ <img>（src="img/works1.jpg" 〜 6.jpg）を配置します。
      -->




      <!-- 
        【写経ガイド 5: News セクション】
        - <section id="news" class="wrapper">
        - 見出し <h2 class="section-title">News</h2>
        - <dl> 内に <dt>日付</dt> ＋ <dd>お知らせ本文</dd> のペアを3セット配置します。
      -->




      <!-- 
        【写経ガイド 6: Contact セクション】
        - <section id="contact" class="wrapper">
        - 見出し <h2 class="section-title">Contact</h2>
        - <form action="#" method="post"> 内に定義リスト <dl> を作成：
          <dt><label for="name">NAME</label></dt>
          <dd><input type="text" id="name" name="your-name"></dd>
          <dt><label for="email">E-MAIL</label></dt>
          <dd><input type="email" id="email" name="your-email"></dd>
          <dt><label for="message">MESSAGE</label></dt>
          <dd><textarea id="message" name="your-message"></textarea></dd>
        - 送信ボタン <div class="button"><input type="submit" value="送信"></div> を配置します。
      -->




    </main>

    <!-- 
      【写経ガイド 7: フッター】
      - <footer id="footer">
      - <p>&copy; 2020 My Portfolio</p>
    -->




  </body>
</html>
