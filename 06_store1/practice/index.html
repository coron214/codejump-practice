<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>Mag88 - 写経・練習用</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="img/favicon.ico">
    <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">
    <link rel="stylesheet" href="css/style.css">
  </head>

  <body>
    <!-- 
      【写経ガイド 1: ヘッダー (画面全高ヒーロー背景 ＋ 右上ロゴ)】
      - <header id="header">
      - 右上に絶対配置するロゴ <h1 class="site-title"><img src="img/logo.svg" alt="Mag88"></h1>
    -->




    <main>
      <!-- 
        【写経ガイド 2: Magazine セクション】
        - <section id="magazine" class="wrapper">
        - 見出し <h2 class="sec-title">、リード文 <p>
        - 2分割カード枠 <div class="flex-item"> 内に <a> タグ（class="item"）を2点配置：
          <a class="item" href="#">
            <img src="img/magazine-archive.jpg" alt="Archive">
            <div class="text">
              <p class="title">Archive</p>
              <p>説明文</p>
            </div>
          </a>
      -->




      <!-- 
        【写経ガイド 3: Fashion セクション】
        - <section id="fashion">
        - 内部に <div class="wrapper"> を用意し、見出し <h2 class="sec-title">Fashion &amp; Style</h2>、<p>、ボタン <a class="btn" href="#">Read More</a> を配置します。
      -->




      <!-- 
        【写経ガイド 4: Catalog セクション】
        - <section class="catalog-antique">
        - <div class="flex-item wrapper"> 内に、左側画像 <div class="item"><img src="img/catalog.jpg"></div> と 右側文章 <div class="item">（見出し、p段落）を配置します。
      -->




      <!-- 
        【写経ガイド 5: Antique セクション】
        - <section class="catalog-antique">
        - <div class="flex-item wrapper"> 内に、左側文章 <div class="item">（見出し、p段落、a.btn） と 右側画像 <div class="item"><img src="img/antique.jpg"></div> を配置します。
      -->




    </main>

    <!-- 
      【写経ガイド 6: フッター】
      - <footer id="footer">
      - <div class="flex-item wrapper"> 内に 3つの <div class="item"> を配置：
        1. ロゴ画像
        2. カスタム箇条書きリスト (ul > li)
        3. サイト概要説明テキスト
      - コピーライト <p class="copyright">&copy; Mag88</p>
    -->




  </body>
</html>
